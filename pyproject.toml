[project]
name = "dxtui"
version = "0.1.0"
description = "dx: explore parquet, CSV, JSON, HDF5 and Excel files of any size in your terminal, with pandas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jimhendy", email = "jimhendy@hotmail.com" }]
requires-python = ">=3.11"
keywords = ["pandas", "parquet", "csv", "tui", "textual", "data", "duckdb", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = [
    "pandas>=2.2",
    "numpy",
    "pyarrow>=15",
    "duckdb>=1.1,<2",  # 2.x wheels need AVX2 (illegal instruction on older CPUs)
    "h5py",
    "openpyxl",
    "textual>=8.0",
    "textual-plotext>=1.0",
]

[project.urls]
Homepage = "https://github.com/jimhendy/dx"
Issues = "https://github.com/jimhendy/dx/issues"

[project.scripts]
dx = "dxtui.app:main"

[dependency-groups]
dev = ["pytest", "tables"]
# tools/record_gifs.py: renders frames in headless Chrome and builds the GIFs
demo = ["playwright", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dxtui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
